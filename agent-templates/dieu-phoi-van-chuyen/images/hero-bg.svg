<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 480" width="1600" height="480" role="img" aria-label="Điều phối vận chuyển — banner">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232a39"/>
      <stop offset="0.55" stop-color="#161a23"/>
      <stop offset="1" stop-color="#0f1218"/>
    </linearGradient>
    <linearGradient id="hroute" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fd5e64" stop-opacity="0.25"/>
      <stop offset="0.5" stop-color="#fd5e64"/>
      <stop offset="1" stop-color="#ff9a5c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.3" r="0.55">
      <stop offset="0" stop-color="#fd5e64" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#fd5e64" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="480" fill="url(#hbg)"/>
  <rect width="1600" height="480" fill="url(#glow)"/>

  <!-- lưới bản đồ -->
  <g stroke="#2a3141" stroke-width="1">
    <path d="M0 96 H1600 M0 192 H1600 M0 288 H1600 M0 384 H1600"/>
    <path d="M200 0 V480 M400 0 V480 M600 0 V480 M800 0 V480 M1000 0 V480 M1200 0 V480 M1400 0 V480"/>
  </g>

  <!-- 3 tuyến giao song song, độ mờ khác nhau -->
  <path d="M120 400 C 320 400, 380 300, 620 300 S 980 210, 1240 180"
        fill="none" stroke="url(#hroute)" stroke-width="8" stroke-linecap="round" stroke-dasharray="2 16"/>
  <path d="M120 400 C 300 400, 400 360, 700 356 S 1060 330, 1330 316"
        fill="none" stroke="#fd5e64" stroke-opacity="0.35" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 14"/>
  <path d="M120 400 C 260 396, 340 250, 560 232 S 900 120, 1120 96"
        fill="none" stroke="#ff9a5c" stroke-opacity="0.22" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 14"/>

  <!-- kho -->
  <g transform="translate(120 400)">
    <circle r="26" fill="#0f1218" stroke="#fd5e64" stroke-width="10"/>
    <rect x="-9" y="-9" width="18" height="18" rx="3" fill="#fd5e64"/>
  </g>

  <!-- 3 điểm giao -->
  <g fill="#fd5e64">
    <path d="M1240 140 c14 0 26 12 26 26 0 18-26 44-26 44s-26-26-26-44c0-14 12-26 26-26z"/>
    <path d="M1330 276 c12 0 22 10 22 22 0 15-22 38-22 38s-22-23-22-38c0-12 10-22 22-22z" opacity="0.55"/>
    <path d="M1120 56 c12 0 22 10 22 22 0 15-22 38-22 38s-22-23-22-38c0-12 10-22 22-22z" opacity="0.38"/>
  </g>

  <text x="120" y="150" font-family="Helvetica, Arial, sans-serif" font-size="62" font-weight="700" fill="#f2f4f7">Điều phối vận chuyển</text>
  <text x="120" y="206" font-family="Helvetica, Arial, sans-serif" font-size="27" fill="#9aa3b6">Chọn tài xế theo quy tắc của bạn, không theo cảm tính</text>

  <!-- 3 nhãn năng lực -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#cfd5e0">
    <g transform="translate(120 258)">
      <rect width="212" height="42" rx="21" fill="#1b202b" stroke="#333c4d"/>
      <text x="24" y="27">Google Sheet</text>
    </g>
    <g transform="translate(348 258)">
      <rect width="182" height="42" rx="21" fill="#1b202b" stroke="#333c4d"/>
      <text x="24" y="27">Telegram</text>
    </g>
    <g transform="translate(546 258)">
      <rect width="238" height="42" rx="21" fill="#1b202b" stroke="#333c4d"/>
      <text x="24" y="27">Xe máy nội thành</text>
    </g>
  </g>
</svg>
