name: Publish GitHub Pages

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

# Each deployment replaces the whole site, so serialize both build and deploy.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out production
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          path: production
          persist-credentials: false
      - name: Check out staging
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: staging
          path: staging
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Generate production indexes
        working-directory: production
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run build:llms
          npm run test:pages
      - name: Generate staging indexes
        working-directory: staging
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run build:llms
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Assemble both environments
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: node production/scripts/build-pages.mjs production staging public
      - name: Build HTML pages
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./public
          destination: ./_site
      # Jekyll renders .md to .html; agents fetch the raw .md/.txt, so publish
      # both. _site is written by the action's container, so merge into a new dir.
      - name: Preserve machine-readable catalog files
        run: |
          mkdir site
          cp -R _site/. site/
          cp -R public/. site/
      - name: Upload complete site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy complete site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
